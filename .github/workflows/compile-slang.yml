name: Slang cross-compile & commit binaries

on:
  push:
    # Submodule bumps show up as a change to the gitlink path. Any branch:
    # binaries belong on the branch the bump landed on.
    paths:
      - 'Vendor/slang'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Manual runs build on their own ci/ branch and merge back afterwards, so a
  # dispatch never writes straight to the branch you triggered it from. Pushes
  # (submodule bumps) already sit on their own feature branch, so they build in
  # place.
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.plan.outputs.branch }}
      source: ${{ steps.plan.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: plan
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source_branch="${GITHUB_REF#refs/heads/}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "branch=$source_branch" >> $GITHUB_OUTPUT
            echo "source=" >> $GITHUB_OUTPUT
            exit 0
          fi
          # e.g. owner/repo/.github/workflows/compile-slang.yml@refs/heads/master
          wf="${GITHUB_WORKFLOW_REF%%@*}"; wf="${wf##*/}"; wf="${wf%.*}"
          # cut, not --short: the submodule commit object isn't in this repo,
          # so git can't pick an abbreviation length for it.
          slang_sha=$(git rev-parse "HEAD:Vendor/slang" | cut -c1-12)
          branch="ci/$wf/$slang_sha"
          remote="https://x-access-token:${GIT_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$remote" "$branch" >/dev/null 2>&1; then
            echo "::notice::reusing existing $branch"
          else
            git push "$remote" "HEAD:refs/heads/$branch"
          fi
          echo "branch=$branch" >> $GITHUB_OUTPUT
          echo "source=$source_branch" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: win-x86_64
            msvc_arch: amd64
            lib_ext: dll
          # amd64_arm64 = x64 host, ARM64 target; plain arm64 is ARM64-hosted
          # and won't run here. cl pinned so CMake doesn't find ARM64 clang.
          - os: windows-2025
            target: win-arm64
            msvc_arch: amd64_arm64
            cross: true
            cmake_opts: |
              CMAKE_SYSTEM_NAME=Windows
              CMAKE_SYSTEM_PROCESSOR=ARM64
              CMAKE_C_COMPILER=cl
              CMAKE_CXX_COMPILER=cl
            lib_ext: dll

          - os: ubuntu-24.04
            target: linux-x86_64
            lib_ext: so
          - os: ubuntu-24.04
            target: linux-aarch64
            cross: true
            cmake_opts: |
              CMAKE_SYSTEM_NAME=Linux
              CMAKE_SYSTEM_PROCESSOR=aarch64
              CMAKE_C_COMPILER=aarch64-linux-gnu-gcc
              CMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
            lib_ext: so

          # Xcode's SDK is universal, so both arches come off the arm64 runner.
          - os: macos-15
            target: macos-x86_64
            cmake_opts: CMAKE_OSX_ARCHITECTURES=x86_64
            lib_ext: dylib
          - os: macos-15
            target: macos-arm64
            cmake_opts: CMAKE_OSX_ARCHITECTURES=arm64
            lib_ext: dylib

          - os: ubuntu-24.04
            target: android-arm64
            cross: true
            cmake_opts: |
              ANDROID_ABI=arm64-v8a
              ANDROID_PLATFORM=android-28
            lib_ext: so

          # .NET on WASM statically links native code into dotnet.wasm, so this
          # wants an archive rather than Emscripten's .js loader. Overrides the
          # defaults below (last -D wins); objcopy can't strip wasm output.
          - os: ubuntu-24.04
            target: wasm-emscripten
            cross: true
            cmake_opts: |
              SLANG_LIB_TYPE=STATIC
              SLANG_ENABLE_SPLIT_DEBUG_INFO=OFF
            lib_ext: a

    env:
      BUILD_ROOT: ${{ github.workspace }}/slang-build
      OUTPUT_ROOT: ${{ github.workspace }}/NetSlang/lib/${{ matrix.target }}
      # git reads identity from the environment; no `git config` step needed.
      GIT_AUTHOR_NAME: ${{ vars.CI_NAME }}
      GIT_AUTHOR_EMAIL: ${{ vars.CI_EMAIL }}
      GIT_COMMITTER_NAME: ${{ vars.CI_NAME }}
      GIT_COMMITTER_EMAIL: ${{ vars.CI_EMAIL }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.branch }}
          persist-credentials: false
          submodules: recursive
          # Slang versions itself from `git describe`, and the push retry rebases.
          fetch-depth: 0

      - name: Configure commit signing
        run: |
          key="$(git rev-parse --show-toplevel)/.git/signing_key"
          printf '%s\n' "${{ secrets.CI_SIGNING_KEY }}" > "$key"
          chmod 600 "$key"
          git config gpg.format ssh
          git config user.signingkey "$key"
          git config commit.gpgsign true
          git config rebase.gpgSign true

      - name: Install Linux aarch64 cross-compiler
        if: matrix.target == 'linux-aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install Emscripten SDK
        if: matrix.target == 'wasm-emscripten'
        uses: emscripten-core/setup-emsdk@v16

      # Slang runs slang-embed/generate/fiddle during its own build, so cross
      # targets need them built for the host first.
      - name: Set up host MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: amd64

      - name: Build host generators
        if: matrix.cross
        uses: threeal/cmake-action@v2.1.0
        with:
          generator: Ninja
          source-dir: ${{ github.workspace }}/Vendor/slang
          build-dir: ${{ github.workspace }}/slang-build/generators
          options: |
            CMAKE_BUILD_TYPE=Release
            SLANG_ENABLE_TESTS=OFF
            SLANG_ENABLE_EXAMPLES=OFF
            SLANG_ENABLE_GFX=OFF
            SLANG_ENABLE_SLANGD=OFF
            SLANG_ENABLE_SLANG_RHI=OFF
            SLANG_SLANG_LLVM_FLAVOR=DISABLE
            SLANG_ENABLE_SPLIT_DEBUG_INFO=ON
          build-args: --target all-generators

      - name: Install host generators
        if: matrix.cross
        run: |
          cmake --install "${BUILD_ROOT}/generators" \
            --config Release \
            --component generators \
            --prefix "${BUILD_ROOT}/generators-install"
          # Fail here; otherwise Slang silently rebuilds them for the target.
          ls -l "${BUILD_ROOT}/generators-install/bin"
          test -x "${BUILD_ROOT}/generators-install/bin/slang-embed" \
            || test -x "${BUILD_ROOT}/generators-install/bin/slang-embed.exe" \
            || { echo "::error::host generators missing from install prefix"; exit 1; }

      # CMake reads CMAKE_TOOLCHAIN_FILE from the env, so set it only after the
      # host generators are built. Both SDKs are already on the runner.
      - name: Point CMake at the target toolchain
        if: matrix.target == 'android-arm64' || matrix.target == 'wasm-emscripten'
        run: |
          case "${{ matrix.target }}" in
            android-arm64)   tc="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" ;;
            wasm-emscripten) tc="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" ;;
          esac
          echo "CMAKE_TOOLCHAIN_FILE=$tc" >> $GITHUB_ENV

      - name: Set up target MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build Project
        uses: threeal/cmake-action@v2.1.0
        with:
          generator: Ninja
          source-dir: ${{ github.workspace }}/Vendor/slang
          build-dir: ${{ github.workspace }}/slang-build/${{ matrix.target }}
          options: |
            CMAKE_BUILD_TYPE=Release
            SLANG_LIB_TYPE=SHARED
            SLANG_ENABLE_TESTS=OFF
            SLANG_ENABLE_EXAMPLES=OFF
            SLANG_ENABLE_GFX=OFF
            SLANG_ENABLE_SLANGD=OFF
            SLANG_ENABLE_SLANG_RHI=OFF
            SLANG_SLANG_LLVM_FLAVOR=DISABLE
            SLANG_ENABLE_SPLIT_DEBUG_INFO=ON
            ${{ matrix.cross && format('SLANG_GENERATORS_PATH={0}/slang-build/generators-install/bin', github.workspace) || '' }}
            ${{ matrix.cmake_opts }}
          build-args: --config Release

      # Install rather than guess: names, version symlinks and the bin/lib split
      # are platform-specific and Slang already knows them.
      - name: Install to a staging prefix
        run: |
          cmake --install "${BUILD_ROOT}/${{ matrix.target }}" \
            --config Release \
            --prefix "${BUILD_ROOT}/install"

      - name: Copy libraries to lib folder
        run: |
          # slang-glslang is dlopen'd from the directory holding the Slang
          # library, so it has to sit next to slang-compiler. WASM links
          # statically and has no runtime module loading, so skip it there.
          libs=(slang-compiler)
          if [ "${{ matrix.target }}" != "wasm-emscripten" ]; then
            libs+=(slang-glslang)
          fi
          name_args=()
          for lib in "${libs[@]}"; do
            name_args+=(-o -name "*${lib}*")
          done
          name_args=("${name_args[@]:1}")

          # Filenames carry the Slang version, so wipe or old ones linger.
          rm -rf "${OUTPUT_ROOT}"
          mkdir -p "${OUTPUT_ROOT}"
          # cp -a keeps the soname symlink Linux needs at load time.
          find "${BUILD_ROOT}/install" \( -type f -o -type l \) \
            \( "${name_args[@]}" \) \
            ! -name "*.h" ! -name "*.cmake" \
            ! -name "*.dwarf" ! -name "*.pdb" \
            -exec cp -a {} "${OUTPUT_ROOT}/" \;
          ls -l "${OUTPUT_ROOT}"

          # Per-library: a present slang-compiler would mask a missing glslang.
          missing=()
          for lib in "${libs[@]}"; do
            compgen -G "${OUTPUT_ROOT}/*${lib}*" >/dev/null || missing+=("$lib")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::not installed for ${{ matrix.target }}: ${missing[*]}"
            echo "--- staging prefix ---"
            find "${BUILD_ROOT}/install" \( -type f -o -type l \)
            echo "--- build tree ---"
            find "${BUILD_ROOT}/${{ matrix.target }}" -name "*slang*" \( -type f -o -type l \)
            exit 1
          fi

      # Static archives keep every object's debug info and Slang builds Release
      # with -g. Debug only: the symbols are still needed at link time.
      - name: Strip wasm archive
        if: matrix.target == 'wasm-emscripten'
        run: |
          "$EMSDK/upstream/bin/llvm-strip" --strip-debug "${OUTPUT_ROOT}"/*.a
          ls -l "${OUTPUT_ROOT}"

      - name: Commit and push binaries
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A NetSlang/lib/${{ matrix.target }}
          if git diff --cached --quiet; then
            echo "No changes for ${{ matrix.target }}."
            exit 0
          fi
          git commit -m "ci: update Slang binaries for ${{ matrix.target }}"
          remote="https://x-access-token:${GIT_TOKEN}@github.com/${{ github.repository }}.git"
          branch="${{ needs.prepare.outputs.branch }}"
          # All matrix legs push to the same branch, so losing the race is normal.
          for attempt in 1 2 3 4 5; do
            if git push "$remote" "HEAD:$branch"; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing"
            git pull --rebase "$remote" "$branch"
          done
          echo "::error::could not push after 5 attempts"
          exit 1

  # Merge the ci/ branch back. Branch protection refusing the push is an
  # expected outcome, not a failure: fall back to opening a PR.
  integrate:
    needs: [prepare, build]
    if: needs.prepare.outputs.source != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      # Assignees go through the issues API even on a PR.
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_BRANCH: ${{ needs.prepare.outputs.branch }}
      SRC_BRANCH: ${{ needs.prepare.outputs.source }}
      GIT_AUTHOR_NAME: ${{ vars.CI_NAME }}
      GIT_AUTHOR_EMAIL: ${{ vars.CI_EMAIL }}
      GIT_COMMITTER_NAME: ${{ vars.CI_NAME }}
      GIT_COMMITTER_EMAIL: ${{ vars.CI_EMAIL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure commit signing
        run: |
          key="$(git rev-parse --show-toplevel)/.git/signing_key"
          printf '%s\n' "${{ secrets.CI_SIGNING_KEY }}" > "$key"
          chmod 600 "$key"
          git config gpg.format ssh
          git config user.signingkey "$key"
          git config commit.gpgsign true
          git config rebase.gpgSign true

      - name: Merge into source branch, or open a PR
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch "$remote" "$CI_BRANCH"; ci=$(git rev-parse FETCH_HEAD)
          git fetch "$remote" "$SRC_BRANCH"; src=$(git rev-parse FETCH_HEAD)

          if git merge-base --is-ancestor "$ci" "$src"; then
            echo "::notice::$CI_BRANCH already contained in $SRC_BRANCH, nothing to merge"
            exit 0
          fi

          git checkout -B "$SRC_BRANCH" "$src"
          if ! git merge --no-ff "$ci" -m "ci: merge $CI_BRANCH into $SRC_BRANCH"; then
            git merge --abort || true
            echo "::warning::merge conflict; opening a PR instead"
          elif git push "$remote" "$SRC_BRANCH"; then
            echo "::notice::merged $CI_BRANCH into $SRC_BRANCH"
            exit 0
          else
            echo "::warning::push to $SRC_BRANCH refused (branch protection?); opening a PR"
          fi

          url=$(gh pr list --head "$CI_BRANCH" --base "$SRC_BRANCH" --state open --json url --jq '.[0].url')
          if [ -z "$url" ]; then
            url=$(gh pr create --head "$CI_BRANCH" --base "$SRC_BRANCH" \
              --title "ci: Slang binaries for $CI_BRANCH" \
              --body "Automated native build. Merge this to bring the binaries into \`$SRC_BRANCH\`.")
          fi

          # Whoever pushed the submodule bump or clicked dispatch. Separate
          # calls, after create: a login that cannot be requested (a bot actor,
          # an outside collaborator) must not sink the PR itself.
          gh pr edit "$url" --add-reviewer "$GITHUB_ACTOR" \
            || echo "::warning::could not request review from $GITHUB_ACTOR"
          gh pr edit "$url" --add-assignee "$GITHUB_ACTOR" \
            || echo "::warning::could not assign $GITHUB_ACTOR"

          echo "::notice::review and merge $url"
