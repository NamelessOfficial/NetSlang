# .github/workflows/compile-slang.yml
name: Slang cross‑compile & commit binaries
on:
  push:
    branches: [ main ]
  workflow_dispatch:          # manual trigger

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- Windows ----------
          - os: windows-2022
            target: win-x86_64
            toolchain: win64-x86_64.cmake
            lib_ext: dll
          - os: windows-2022
            target: win-arm64
            toolchain: win-arm64.cmake
            lib_ext: dll

          # ---------- Linux ----------
          - os: ubuntu-22.04
            target: linux-x86_64
            toolchain: linux-x86_64.cmake
            lib_ext: so
          - os: ubuntu-22.04
            target: linux-aarch64
            toolchain: linux-aarch64.cmake
            lib_ext: so

          # ---------- macOS ----------
          - os: macos-13          # Intel runner (x86_64)
            target: macos-x86_64
            toolchain: macos-x86_64.cmake
            lib_ext: dylib
          - os: macos-14          # Apple‑silicon runner (arm64)
            target: macos-arm64
            toolchain: macos-arm64.cmake
            lib_ext: dylib

          # ---------- Android (ARM64) ----------
          - os: ubuntu-22.04
            target: android-arm64
            toolchain: android-arm64.cmake
            lib_ext: so

          # ---------- WebAssembly (Emscripten) ----------
          - os: ubuntu-22.04
            target: wasm-emscripten
            toolchain: wasm-emscripten.cmake
            lib_ext: js   # Emscripten emits a .js wrapper (and .wasm)

    env:
      SLANG_REPO: https://github.com/shader-slang/slang.git
      BUILD_ROOT: ${{ github.workspace }}/slang-build
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains
      OUTPUT_ROOT: ${{ github.workspace }}/prebuilt/${{ matrix.target }}

    steps:
      # ---------------------------------------------------------
      # 0️⃣  Checkout this repository (the one that will receive the binaries)
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # we’ll push with a separate token

      # ---------------------------------------------------------
      # 1️⃣  Install CMake (official action) and Ninja
      # ---------------------------------------------------------
      - name: Install CMake
        uses: ursdev/setup-cmake@v2        # provides latest CMake + adds to PATH
        with:
          cmake-version: 3.27

      - name: Install Ninja (cross‑platform)
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            choco install ninja -y
          else
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      # ---------------------------------------------------------
      # 2️⃣  Install platform‑specific toolchains
      # ---------------------------------------------------------
      - name: Install Linux aarch64 cross‑compiler
        if: runner.os == 'Linux' && matrix.target == 'linux-aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install Android NDK
        if: matrix.target == 'android-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          wget -qO- https://dl.google.com/android/repository/android-ndk-r27-linux.zip | sudo unzip -d /opt
          echo "ANDROID_NDK_ROOT=/opt/android-ndk-r27" >> $GITHUB_ENV
          echo "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install Emscripten SDK
        if: matrix.target == 'wasm-emscripten'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git --depth 1
          ./emsdk/emsdk install latest
          ./emsdk/emsdk activate latest
          source ./emsdk/emsdk_env.sh
          echo "$(pwd)/emsdk" >> $GITHUB_PATH

      # ---------------------------------------------------------
      # 3️⃣  Copy custom CMake toolchain files
      # ---------------------------------------------------------
      - name: Copy toolchain files
        run: |
          mkdir -p "${TOOLCHAIN_DIR}"
          cp -r .github/toolchains/* "${TOOLCHAIN_DIR}/"

      # ---------------------------------------------------------
      # 4️⃣  Clone Slang source code
      # ---------------------------------------------------------
      - name: Clone Slang repository
        run: |
          git clone "${SLANG_REPO}" "${BUILD_ROOT}/src"
          # Optional: checkout a specific tag, e.g. v2025.21
          # cd "${BUILD_ROOT}/src" && git checkout v2025.21

      # ---------------------------------------------------------
      # 5️⃣  CMake configuration
      # ---------------------------------------------------------
      - name: CMake configure
        run: |
          cmake -S "${BUILD_ROOT}/src" \
                -B "${BUILD_ROOT}/${{ matrix.target }}" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN_DIR}/${{ matrix.toolchain }}" \
                -DSLANG_ENABLE_SHARED=ON \
                -DSLANG_BUILD_STATIC=OFF

      # ---------------------------------------------------------
      # 6️⃣  Build the shared library
      # ---------------------------------------------------------
      - name: CMake build
        run: |
          cmake --build "${BUILD_ROOT}/${{ matrix.target }}" --config Release

      # ---------------------------------------------------------
      # 7️⃣  Locate the produced library and copy it to a version‑controlled path
      # ---------------------------------------------------------
      - name: Locate output library
        id: locate
        run: |
          lib=$(find "${BUILD_ROOT}/${{ matrix.target }}" -type f -name "slang-compiler.*${{ matrix.lib_ext }}" | head -n1)
          echo "lib_path=$lib" >> $GITHUB_OUTPUT

      - name: Copy library to prebuilt folder
        run: |
          mkdir -p "${OUTPUT_ROOT}"
          cp "${{ steps.locate.outputs.lib_path }}" "${OUTPUT_ROOT}/"

      # ---------------------------------------------------------
      # 8️⃣  Commit & push binaries back to the repo
      # ---------------------------------------------------------
      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push binaries
        env:
          # Create a secret named PAT_TOKEN with `repo` scope.
          GIT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git add prebuilt/${{ matrix.target }}/*
          if git diff --cached --quiet; then
            echo "No changes for ${{ matrix.target }} – nothing to commit."
          else
            git commit -m "ci: update Slang binaries for ${{ matrix.target }} (auto‑generated)"
            git push https://x-access-token:${GIT_TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
          fi