# .github/workflows/compile-slang.yml
name: Slang cross‑compile & commit binaries
on:
  push:
    branches: [ main ]
  workflow_dispatch:          # manual trigger

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ponytail: no custom toolchain files. Native targets need none;
          # android/wasm reuse the toolchain that ships with the NDK / emsdk.
          # ---------- Windows ----------
          - os: windows-2025
            target: win-x86_64
            msvc_arch: amd64
            lib_ext: dll
          # amd64_arm64 = x64 host, ARM64 target. Plain "arm64" would select the
          # ARM64-hosted toolchain, which cannot run on an x64 runner.
          # cl is pinned so CMake uses the one vcvars put on PATH instead of
          # discovering the ARM64-hosted clang.
          - os: windows-2025
            target: win-arm64
            msvc_arch: amd64_arm64
            cmake_opts: |
              CMAKE_SYSTEM_NAME=Windows
              CMAKE_SYSTEM_PROCESSOR=ARM64
              CMAKE_C_COMPILER=cl
              CMAKE_CXX_COMPILER=cl
            lib_ext: dll

          # ---------- Linux ----------
          - os: ubuntu-24.04
            target: linux-x86_64
            lib_ext: so
          - os: ubuntu-24.04
            target: linux-aarch64
            cmake_opts: |
              CMAKE_SYSTEM_NAME=Linux
              CMAKE_SYSTEM_PROCESSOR=aarch64
              CMAKE_C_COMPILER=aarch64-linux-gnu-gcc
              CMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
            lib_ext: so

          # ---------- macOS ----------
          # Both from the arm64 runner; the Xcode SDK is universal, so
          # CMAKE_OSX_ARCHITECTURES covers x86_64 without an Intel runner.
          - os: macos-15
            target: macos-x86_64
            cmake_opts: CMAKE_OSX_ARCHITECTURES=x86_64
            lib_ext: dylib
          - os: macos-15
            target: macos-arm64
            cmake_opts: CMAKE_OSX_ARCHITECTURES=arm64
            lib_ext: dylib

          # ---------- Android (ARM64) ----------
          # CMAKE_TOOLCHAIN_FILE comes from the env, set by the NDK step
          - os: ubuntu-24.04
            target: android-arm64
            cmake_opts: |
              ANDROID_ABI=arm64-v8a
              ANDROID_PLATFORM=android-28
            lib_ext: so

          # ---------- WebAssembly (Emscripten) ----------
          - os: ubuntu-24.04
            target: wasm-emscripten
            lib_ext: js   # Emscripten emits a .js wrapper (and .wasm)

    env:
      SLANG_REPO: https://github.com/shader-slang/slang.git
      BUILD_ROOT: ${{ github.workspace }}/slang-build
      OUTPUT_ROOT: ${{ github.workspace }}/prebuilt/${{ matrix.target }}

    # bash on every runner, so one set of scripts works on Windows too
    defaults:
      run:
        shell: bash

    steps:
      # ---------------------------------------------------------
      # 0️⃣  Checkout this repository (the one that will receive the binaries)
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false   # we’ll push with a separate token

      # ---------------------------------------------------------
      # 2️⃣  Install platform‑specific toolchains
      # ---------------------------------------------------------
      - name: Install Linux aarch64 cross‑compiler
        if: runner.os == 'Linux' && matrix.target == 'linux-aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      # ponytail: ubuntu runners ship an NDK already, no download needed.
      # CMake >= 3.21 reads CMAKE_TOOLCHAIN_FILE from the environment, so the
      # cmake-action needs no toolchain option of its own.
      - name: Use preinstalled Android NDK
        if: matrix.target == 'android-arm64'
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" >> $GITHUB_ENV

      - name: Install Emscripten SDK
        if: matrix.target == 'wasm-emscripten'
        uses: emscripten-core/setup-emsdk@v16

      - name: Point CMake at the Emscripten toolchain
        if: matrix.target == 'wasm-emscripten'
        run: echo "CMAKE_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" >> $GITHUB_ENV

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}

      # ---------------------------------------------------------
      # 4️⃣  Clone Slang source code
      # ---------------------------------------------------------
      - name: Clone Slang repository
        run: |
          git clone "${SLANG_REPO}" "${BUILD_ROOT}/src" --recurse-submodules
          # Optional: checkout a specific tag, e.g. v2025.21
          # cd "${BUILD_ROOT}/src" && git checkout v2025.21

      - name: Build Project
        uses: threeal/cmake-action@v2.1.0
        with:
          generator: Ninja
          source-dir: ${{ github.workspace }}/slang-build/src
          build-dir: ${{ github.workspace }}/slang-build/${{ matrix.target }}
          options: |
            CMAKE_BUILD_TYPE=Release
            SLANG_LIB_TYPE=SHARED
            SLANG_ENABLE_TESTS=OFF
            SLANG_ENABLE_EXAMPLES=OFF
            SLANG_ENABLE_GFX=OFF
            SLANG_ENABLE_SLANGD=OFF
            SLANG_ENABLE_SLANG_RHI=OFF
            SLANG_SLANG_LLVM_FLAVOR=DISABLE
            ${{ matrix.cmake_opts }}
          build-args: --config Release

      # ---------------------------------------------------------
      # 7️⃣  Locate the produced library and copy it to a version‑controlled path
      # ---------------------------------------------------------
      - name: Copy library to prebuilt folder
        run: |
          lib=$(find "${BUILD_ROOT}/${{ matrix.target }}" -type f \
            \( -name "slang-compiler.${{ matrix.lib_ext }}" \
            -o -name "libslang-compiler.${{ matrix.lib_ext }}" \) | head -n1)
          test -n "$lib" || { echo "::error::no slang-compiler.${{ matrix.lib_ext }} produced"; exit 1; }
          mkdir -p "${OUTPUT_ROOT}"
          cp "$lib" "${OUTPUT_ROOT}/"

      # ---------------------------------------------------------
      # 8️⃣  Commit & push binaries back to the repo
      # ---------------------------------------------------------
      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push binaries
        env:
          # Create a secret named PAT_TOKEN with `repo` scope.
          GIT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git add prebuilt/${{ matrix.target }}/*
          if git diff --cached --quiet; then
            echo "No changes for ${{ matrix.target }} – nothing to commit."
          else
            git commit -m "ci: update Slang binaries for ${{ matrix.target }} (auto‑generated)"
            git push https://x-access-token:${GIT_TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
          fi