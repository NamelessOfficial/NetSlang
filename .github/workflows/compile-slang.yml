name: Slang cross-compile & commit binaries

on:
  push:
    # Submodule bumps show up as a change to the gitlink path. Any branch:
    # binaries belong on the branch the bump landed on.
    paths:
      - 'Vendor/slang'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: win-x86_64
            msvc_arch: amd64
            lib_ext: dll
          # amd64_arm64 = x64 host, ARM64 target; plain arm64 is ARM64-hosted
          # and won't run here. cl pinned so CMake doesn't find ARM64 clang.
          - os: windows-2025
            target: win-arm64
            msvc_arch: amd64_arm64
            cross: true
            cmake_opts: |
              CMAKE_SYSTEM_NAME=Windows
              CMAKE_SYSTEM_PROCESSOR=ARM64
              CMAKE_C_COMPILER=cl
              CMAKE_CXX_COMPILER=cl
            lib_ext: dll

          - os: ubuntu-24.04
            target: linux-x86_64
            lib_ext: so
          - os: ubuntu-24.04
            target: linux-aarch64
            cross: true
            cmake_opts: |
              CMAKE_SYSTEM_NAME=Linux
              CMAKE_SYSTEM_PROCESSOR=aarch64
              CMAKE_C_COMPILER=aarch64-linux-gnu-gcc
              CMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
            lib_ext: so

          # Xcode's SDK is universal, so both arches come off the arm64 runner.
          - os: macos-15
            target: macos-x86_64
            cmake_opts: CMAKE_OSX_ARCHITECTURES=x86_64
            lib_ext: dylib
          - os: macos-15
            target: macos-arm64
            cmake_opts: CMAKE_OSX_ARCHITECTURES=arm64
            lib_ext: dylib

          - os: ubuntu-24.04
            target: android-arm64
            cross: true
            cmake_opts: |
              ANDROID_ABI=arm64-v8a
              ANDROID_PLATFORM=android-28
            lib_ext: so

          # .NET on WASM statically links native code into dotnet.wasm, so this
          # wants an archive rather than Emscripten's .js loader. Overrides the
          # defaults below (last -D wins); objcopy can't strip wasm output.
          - os: ubuntu-24.04
            target: wasm-emscripten
            cross: true
            cmake_opts: |
              SLANG_LIB_TYPE=STATIC
              SLANG_ENABLE_SPLIT_DEBUG_INFO=OFF
            lib_ext: a

    env:
      BUILD_ROOT: ${{ github.workspace }}/slang-build
      OUTPUT_ROOT: ${{ github.workspace }}/lib/${{ matrix.target }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
          # Slang versions itself from `git describe`, and the push retry rebases.
          fetch-depth: 0

      - name: Install Linux aarch64 cross-compiler
        if: matrix.target == 'linux-aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Use preinstalled Android NDK
        if: matrix.target == 'android-arm64'
        run: echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Install Emscripten SDK
        if: matrix.target == 'wasm-emscripten'
        uses: emscripten-core/setup-emsdk@v16

      # Slang runs slang-embed/generate/fiddle during its own build, so cross
      # targets need them built for the host first.
      - name: Set up host MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: amd64

      - name: Build host generators
        if: matrix.cross
        uses: threeal/cmake-action@v2.1.0
        with:
          generator: Ninja
          source-dir: ${{ github.workspace }}/Vendor/slang
          build-dir: ${{ github.workspace }}/slang-build/generators
          options: |
            CMAKE_BUILD_TYPE=Release
            SLANG_ENABLE_TESTS=OFF
            SLANG_ENABLE_EXAMPLES=OFF
            SLANG_ENABLE_GFX=OFF
            SLANG_ENABLE_SLANGD=OFF
            SLANG_ENABLE_SLANG_RHI=OFF
            SLANG_SLANG_LLVM_FLAVOR=DISABLE
            SLANG_ENABLE_SPLIT_DEBUG_INFO=ON
          build-args: --target all-generators

      - name: Install host generators
        if: matrix.cross
        run: |
          cmake --install "${BUILD_ROOT}/generators" \
            --config Release \
            --component generators \
            --prefix "${BUILD_ROOT}/generators-install"
          # Fail here; otherwise Slang silently rebuilds them for the target.
          ls -l "${BUILD_ROOT}/generators-install/bin"
          test -x "${BUILD_ROOT}/generators-install/bin/slang-embed" \
            || test -x "${BUILD_ROOT}/generators-install/bin/slang-embed.exe" \
            || { echo "::error::host generators missing from install prefix"; exit 1; }

      # CMake reads CMAKE_TOOLCHAIN_FILE from the env, so set it only after the
      # host generators are built.
      - name: Point CMake at the Android toolchain
        if: matrix.target == 'android-arm64'
        run: echo "CMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" >> $GITHUB_ENV

      - name: Point CMake at the Emscripten toolchain
        if: matrix.target == 'wasm-emscripten'
        run: echo "CMAKE_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" >> $GITHUB_ENV

      - name: Set up target MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build Project
        uses: threeal/cmake-action@v2.1.0
        with:
          generator: Ninja
          source-dir: ${{ github.workspace }}/Vendor/slang
          build-dir: ${{ github.workspace }}/slang-build/${{ matrix.target }}
          options: |
            CMAKE_BUILD_TYPE=Release
            SLANG_LIB_TYPE=SHARED
            SLANG_ENABLE_TESTS=OFF
            SLANG_ENABLE_EXAMPLES=OFF
            SLANG_ENABLE_GFX=OFF
            SLANG_ENABLE_SLANGD=OFF
            SLANG_ENABLE_SLANG_RHI=OFF
            SLANG_SLANG_LLVM_FLAVOR=DISABLE
            SLANG_ENABLE_SPLIT_DEBUG_INFO=ON
            ${{ matrix.cross && format('SLANG_GENERATORS_PATH={0}/slang-build/generators-install/bin', github.workspace) || '' }}
            ${{ matrix.cmake_opts }}
          build-args: --config Release

      # Install rather than guess: names, version symlinks and the bin/lib split
      # are platform-specific and Slang already knows them.
      - name: Install to a staging prefix
        run: |
          cmake --install "${BUILD_ROOT}/${{ matrix.target }}" \
            --config Release \
            --prefix "${BUILD_ROOT}/install"

      - name: Copy library to lib folder
        run: |
          # Filenames carry the Slang version, so wipe or old ones linger.
          rm -rf "${OUTPUT_ROOT}"
          mkdir -p "${OUTPUT_ROOT}"
          # cp -a keeps the soname symlink Linux needs at load time.
          find "${BUILD_ROOT}/install" \( -type f -o -type l \) \
            -name "*slang-compiler*" \
            ! -name "*.h" ! -name "*.cmake" \
            ! -name "*.dwarf" ! -name "*.pdb" \
            -exec cp -a {} "${OUTPUT_ROOT}/" \;
          ls -l "${OUTPUT_ROOT}"
          test -n "$(ls -A "${OUTPUT_ROOT}")" || {
            echo "::error::no slang-compiler library installed for ${{ matrix.target }}"
            echo "--- staging prefix ---"
            find "${BUILD_ROOT}/install" \( -type f -o -type l \)
            echo "--- build tree ---"
            find "${BUILD_ROOT}/${{ matrix.target }}" -name "*slang*" \( -type f -o -type l \)
            exit 1
          }

      # Static archives keep every object's debug info and Slang builds Release
      # with -g. Debug only: the symbols are still needed at link time.
      - name: Strip wasm archive
        if: matrix.target == 'wasm-emscripten'
        run: |
          "$EMSDK/upstream/bin/llvm-strip" --strip-debug "${OUTPUT_ROOT}"/*.a
          ls -l "${OUTPUT_ROOT}"

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push binaries
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A lib/${{ matrix.target }}
          if git diff --cached --quiet; then
            echo "No changes for ${{ matrix.target }}."
            exit 0
          fi
          git commit -m "ci: update Slang binaries for ${{ matrix.target }}"
          remote="https://x-access-token:${GIT_TOKEN}@github.com/${{ github.repository }}.git"
          branch="${GITHUB_REF#refs/heads/}"
          # All matrix legs push to the same branch, so losing the race is normal.
          for attempt in 1 2 3 4 5; do
            if git push "$remote" "HEAD:$branch"; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing"
            git pull --rebase "$remote" "$branch"
          done
          echo "::error::could not push after 5 attempts"
          exit 1
